server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://api.github.com https://hub.docker.com; style-src 'self'; script-src 'self'; img-src 'self' data:;" always;

  location = /health/payments { proxy_pass http://payments-api:8081/actuator/health; }
  location = /health/audit { proxy_pass http://audit-api:8082/actuator/health; }
  location = /health/experiences { proxy_pass http://experiences-api:8083/actuator/health; }
  location = /health/travel { proxy_pass http://travel-benefits-api:8084/actuator/health; }
  location = /health/events { proxy_pass http://events-api:8085/actuator/health; }
  location = /health/social-split { proxy_pass http://social-split-api:8086/actuator/health; }

  location /api/payments { proxy_pass http://payments-api:8081; }
  location /api/outbox { proxy_pass http://payments-api:8081; }
  location /api/audit { proxy_pass http://audit-api:8082; }
  location /api/experiences { proxy_pass http://experiences-api:8083; }
  location /api/travel { proxy_pass http://travel-benefits-api:8084; }
  location /api/events { proxy_pass http://events-api:8085; }
  location /api/splits { proxy_pass http://social-split-api:8086; }

  location ~* \.(css|js|png|svg)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=300";
  }

  location / { try_files $uri $uri/ /index.html; }
}
